[workspace]

[package]
name = "minimal-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "第三方最小启动器示例：装配插件宿主 + 独立 Slint 界面"
build = "build.rs"

[dependencies]
# 关闭默认特性时 Slint 仍要求显式启用向前兼容特性，否则直接编译失败。
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
launcher-runtime = { path = "../../crates/launcher-runtime" }
launcher-api = { path = "../../crates/launcher-api" }
launcher-settings = { path = "../../crates/launcher-settings" }
custom-settings = { path = "../custom-settings" }

[build-dependencies]
slint-build = "=1.18.1"
