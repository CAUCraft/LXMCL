[package]
name = "lxmcl"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "LXMCL Slint desktop frontend"
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "=0.1.34"

[profile.dev]
debug = 1
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
