[workspace]
resolver = "2"
members = ["crates/launcher-runtime", "crates/launcher-api", "crates/launcher-settings", "crates/launcher-instances", "crates/launcher-java"]
# 示例产品与第三方插件保持独立工作区，模拟外部使用者。
exclude = ["examples/custom-settings", "examples/minimal-launcher"]

[package]
name = "lxmcl"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "LXMCL Slint desktop frontend"
build = "build.rs"

[dependencies]
launcher-runtime = { path = "crates/launcher-runtime" }
launcher-api = { path = "crates/launcher-api" }
launcher-settings = { path = "crates/launcher-settings" }
launcher-instances = { path = "crates/launcher-instances" }
launcher-java = { path = "crates/launcher-java" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "=0.1.34"

[profile.dev]
debug = 1
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
