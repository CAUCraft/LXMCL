<!doctype html><meta charset="utf-8"><style>body{margin:0;padding:24px;background:#f3f6fb;color:#20354d;font:13px/1.7 Inter,'Microsoft YaHei',sans-serif}h1{font-size:22px;margin:0 0 10px}label{display:block;padding:9px;background:white;border-radius:8px;margin:8px 0}button{background:#286ce8;color:white;border:0;padding:12px 20px;border-radius:8px;font:inherit;width:100%;cursor:pointer}button:disabled{opacity:.5}small{color:#63768e}#status{white-space:pre-line;margin-top:16px}</style><h1>LXMCL · 三种视觉方向</h1><p>生成原生可编辑画板、按钮组件、颜色样式与主要导航连线。所有服务器和账号数据均为示例。</p><label><input type="checkbox" value="glass" checked> 液态玻璃 · 11 个界面</label><label><input type="checkbox" value="classic" checked> 经典桌面 · 11 个界面</label><label><input type="checkbox" value="terminal" checked> 极简深色 · 11 个界面</label><label><input type="checkbox" id="newpages"> 按风格创建独立页面（需要文件可创建多页）</label><p><small>默认写入当前页面的新区域，不替换已有设计。中文字体优先使用 Noto Sans SC / 微软雅黑。按钮使用 Auto Layout。插画保留矢量路径。</small></p><button id="create">生成可编辑设计</button><div id="status" role="status"></div><hr><p>已绘制文件的检查与定位</p><button onclick="parent.postMessage({pluginMessage:{type:'guide'}},'*')">补充功能地图</button><button style="margin-top:8px" onclick="parent.postMessage({pluginMessage:{type:'inspect'}},'*')">检查图层与导航</button><p><select id="review-theme"><option value="glass">液态玻璃</option><option value="classic">经典桌面</option><option value="terminal">极简深色</option></select> <select id="review-key"><option value="home">开始游戏</option><option value="instances">我的游戏</option><option value="resources">资源中心</option><option value="join">入服确认</option></select></p><button onclick="parent.postMessage({pluginMessage:{type:'show',theme:document.querySelector('#review-theme').value,key:document.querySelector('#review-key').value}},'*')">定位画板并关闭插件</button><script>document.querySelector('#create').onclick=()=>{let themes=[...document.querySelectorAll('input[value]:checked')].map(x=>x.value);if(!themes.length)return;document.querySelector('#create').disabled=true;parent.postMessage({pluginMessage:{type:'build',themes,newpages:document.querySelector('#newpages').checked}},'*')};onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;document.querySelector('#status').textContent=m.text;if(m.done||m.error)document.querySelector('#create').disabled=false};</script>
