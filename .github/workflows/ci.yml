name: LXMCL CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CGO_ENABLED: '0'
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  windows:
    name: Windows x64 tests and package
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check Go formatting
        run: |
          $files = @(git ls-files -- '*.go')
          $unformatted = @(gofmt -l @files)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -ne 0) {
            throw "Run gofmt on: $($unformatted -join ', ')"
          }
      - name: Verify Go modules
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod verify
      - name: Test launcher and native UI
        run: go test -count=1 ./...
      - name: Vet Go code
        run: go vet ./...

      - name: Build portable app and installer
        run: |
          $version = (Get-Content -Raw -LiteralPath mygo.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match mygo.json (v$version)"
          }
          $env:NSISCONFDIR = (Resolve-Path -LiteralPath packaging).Path
          go tool mygo build -platform windows/amd64 -o target/ci-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- go.mod go.sum
      - name: Archive corresponding source
        run: |
          git archive --format=zip -o target/ci-tracked.zip HEAD -- . ':(exclude,glob)ui/assets/wallpapers/*.mp4'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath target/ci-tracked.zip -DestinationPath target/ci-source/LXMCL
          go mod vendor -o target/ci-source/LXMCL/vendor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Set-Content -LiteralPath target/ci-source/LXMCL/SOURCE_COMMIT.txt -Encoding ascii
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path target/ci-artifacts | Out-Null
          $source = (Resolve-Path -LiteralPath target/ci-source).Path
          $archive = Join-Path (Resolve-Path -LiteralPath target/ci-artifacts).Path 'LXMCL-source.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($source, $archive)
      - name: Check package files and generate SHA-256 manifest
        run: |
          $version = (Get-Content -Raw -LiteralPath mygo.json | ConvertFrom-Json).version
          $package = 'target/ci-package/windows-amd64'
          $output = New-Item -ItemType Directory -Force -Path 'target/ci-artifacts'
          $files = @('LXMCL.exe', "lxmcl-setup-$version-amd64.exe")
          foreach ($name in $files) {
            $file = Get-Item -LiteralPath (Join-Path $package $name)
            if ($file.Length -le 0) { throw "Empty package file: $name" }
            Copy-Item -LiteralPath $file.FullName -Destination $output.FullName
          }
          $licenseFiles = @('LICENSE', 'THIRD_PARTY_NOTICES.txt')
          $sources = @(Get-Item -LiteralPath $licenseFiles; Get-ChildItem -LiteralPath 'licenses' -File)
          foreach ($source in $sources) {
            $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $source.FullName)
            $original = Get-FileHash -Algorithm SHA256 -LiteralPath $source.FullName
            $shipped = Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $package $relative)
            if ($original.Hash -ne $shipped.Hash) { throw "Packaged license differs: $relative" }
          }
          $packagedLicenses = ($licenseFiles + 'licenses') | ForEach-Object { Join-Path $package $_ }
          Compress-Archive -LiteralPath $packagedLicenses -DestinationPath (Join-Path $output.FullName 'LXMCL-licenses.zip') -Force
          $hashes = foreach ($name in ($files + 'LXMCL-licenses.zip' + 'LXMCL-source.zip')) {
            $file = Get-Item -LiteralPath (Join-Path $output.FullName $name)
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $name
          }
          $hashes | Set-Content -LiteralPath (Join-Path $output.FullName 'SHA256SUMS.txt') -Encoding ascii
      - name: Upload Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lxmcl-windows-amd64
          path: target/ci-artifacts/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux launcher core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -count=1 ./internal/launcher

  release:
    name: Draft tagged GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lxmcl-windows-amd64
          path: target/release
      - name: Verify packages and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: target/release
        run: |
          sha256sum --check --strict SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.exe LXMCL-licenses.zip LXMCL-source.zip SHA256SUMS.txt \
            --draft --verify-tag --generate-notes --title "LXMCL $RELEASE_TAG"
