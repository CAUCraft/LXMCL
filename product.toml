# LXMCL 产品装配配置。宿主启动时从可执行文件目录向上查找本文件；
# 插件实例化、服务解析与退出清理都由 launcher-runtime 完成。
[product]
id = "org.caucraft.lxmcl"
name = "LXMCL 启动器"

[[plugins]]
id = "settings"
provider = "settings-json"

[plugins.config]
file_name = "launcher-settings.json"

[plugins.config.defaults]
game_root = 'D:\Games\LXMCL'

[[plugins]]
id = "instances"
provider = "instances-json"

[plugins.config]
file_name = "instances.json"

[[plugins]]
id = "java"
provider = "java-local"
